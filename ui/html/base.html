<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Shared expenses{% endblock %}</title>
<style>
  :root {
    --window: #ececec;
    --field: #ffffff;
    --line: #b5b5b5;
    --line-soft: #dcdcdc;
    --header: #e3e3e3;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --red: #c62828;
    --open: #2c5d9e;
    --settled: #2e7d32;
    --mono: Consolas, "Courier New", monospace;
    --sans: "Segoe UI", Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--window); color: var(--text); font: 14px/1.4 var(--sans); }

  .window { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }

  .titlebar { display: flex; align-items: baseline; gap: 1.5rem; padding: 0.9rem 1.25rem 0.6rem; }
  h1 { font: 600 1.15rem var(--mono); margin: 0; }
  .summary { margin: 0; font-weight: 600; display: flex; gap: 1.25rem; }
  .actions { margin-left: auto; display: flex; align-items: center; gap: 1.25rem; }

  .split { display: grid; grid-template-columns: 23rem 1fr; gap: 1.5rem; padding: 0.5rem 1.25rem 1rem; min-height: 0; }
  .pane { min-height: 0; overflow: auto; }

  h2 { font: 600 0.85rem var(--mono); margin: 0 0 0.6rem; }
  .group + .group { margin-top: 1.4rem; }
  .narrow { max-width: 26rem; }

  .fields { display: grid; grid-template-columns: 7.5rem 1fr; gap: 0.45rem 0.75rem; align-items: center; }
  .fields.inline { grid-template-columns: 7.5rem 1fr auto; }
  input, select {
    width: 100%; height: 1.9rem; padding: 0 0.45rem;
    font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 3px;
  }
  input[type="file"] { padding: 0.2rem; height: auto; }
  .hint { color: var(--muted); font-size: 0.8rem; margin: 0.35rem 0 0; }

  .buttons { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
  button {
    font: inherit; color: var(--text);
    background: var(--field); border: 1px solid var(--line); border-radius: 4px;
    padding: 0.25rem 1rem; cursor: pointer;
  }
  button:hover { color: var(--red); border-color: var(--red); }

  a { color: inherit; text-decoration: none; }
  a:hover { color: var(--red); text-decoration: underline; }

  .tabs { display: flex; gap: 1.25rem; margin-bottom: 0.6rem; }
  .tabs a { color: var(--muted); padding-bottom: 0.2rem; border-bottom: 2px solid transparent; }
  .tabs a[aria-current="page"] { color: var(--text); border-bottom-color: var(--text); }

  table { width: 100%; border-collapse: collapse; background: var(--field); border: 1px solid var(--line); }
  th { background: var(--header); font-weight: 500; text-align: left; padding: 0.3rem 0.6rem; border-bottom: 1px solid var(--line); }
  td { padding: 0.3rem 0.6rem; border-bottom: 1px solid var(--line-soft); }
  .num { text-align: right; }
  tfoot td { font-weight: 600; border-bottom: 0; }
  .empty { color: var(--muted); padding: 0.6rem 0; }
  table.result { margin-top: 0.75rem; }

  .status.open { color: var(--open); }
  .status.settled { color: var(--settled); }

  .statusbar { border-top: 1px solid var(--line); padding: 0.3rem 1.25rem; min-height: 1.9rem; }
  .statusbar .error { color: var(--red); }
  .statusbar .idle { color: var(--muted); }
</style>
</head>
<body>
<div class="window">
  <header class="titlebar">
    {% block header %}{% endblock %}
  </header>

  <main class="split">
    <section class="pane">{% block form %}{% endblock %}</section>
    <section class="pane">{% block data %}{% endblock %}</section>
  </main>

  <footer class="statusbar" role="status">
    {% for category, text in get_flashed_messages(with_categories=true) %}
      <span class="{{ category }}">{{ text }}</span>
    {% else %}
      <span class="idle">Ready</span>
    {% endfor %}
  </footer>
</div>
</body>
</html>
