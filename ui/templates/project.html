{% extends "base.html" %}

{% block content %}
<h1>SHARED EXPENSE SETTLEMENT</h1>
<div class="rule">=================================</div>

{% if message %}<div class="message">{{ message }}</div>{% endif %}

<section>
  <h2>[1] PROJECT</h2>
  <form method="post" action="{{ url_for('set_project_name') }}">
    <label for="name">name</label>
    <input id="name" name="name" value="{{ project.name }}" size="28">
    <button type="submit">Set</button>
  </form>
  <span class="dim">status: {{ project.status }}</span>
</section>

<a class="btn" href="{{ url_for('dashboard') }}">Enter project -&gt;</a>
{% endblock %}
